# RabbitMQ broker configuration (sysctl / new-style format).
# docker-compose mounts this into /etc/rabbitmq/conf.d/, where it is merged with the
# image's own defaults.

# ── 1. Let the API / simulator containers authenticate as `guest` ──────────────
#
# By default RabbitMQ only lets the built-in `guest` user authenticate over a
# loopback (localhost) connection. In docker-compose the API and simulator run in
# their own containers and reach the broker across the Docker network, which counts
# as a *remote* connection, so guest/guest is refused with `ACCESS_REFUSED` and the
# consumer can never start — messages pile up in the queue and nothing reaches MSSQL.
#
# Disabling the loopback restriction lets guest connect from the other containers.
# For anything beyond local development, create a dedicated user instead and set
# RABBITMQ_USER / RABBITMQ_PASS on the services.
loopback_users.guest = false

# ── 2. Per-queue Prometheus metrics ───────────────────────────────────────────
#
# The `rabbitmq_prometheus` plugin ships enabled in the official image and serves
# /metrics on port 15692. By default it *aggregates* across every queue, so the
# backlog series arrive with no `queue` label and you cannot tell which queue is
# piling up. Turning on per-object output labels them instead:
#
#   rabbitmq_queue_messages_ready{vhost="/",queue="telemetry-queue"}
#   rabbitmq_queue_consumers{vhost="/",queue="telemetry-queue"}
#
# Everything in the Grafana backlog dashboards and alert rules keys off those
# labels, so this setting is required — without it the panels render empty.
#
# Cost note: per-object emits one series per queue/connection/channel, which gets
# expensive once you have thousands of queues. This deployment has a single
# telemetry-queue, so the overhead is negligible.
prometheus.return_per_object_metrics = true
