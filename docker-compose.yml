services:

  # ──────────────────────────────────────────────
  # Message Broker
  # ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
      - "15692:15692"  # Prometheus metrics (rabbitmq_prometheus plugin)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Broker config: lifts the guest loopback-only restriction so the API/simulator
      # containers can authenticate over the Docker network, and switches the
      # Prometheus plugin to per-queue (per-object) metrics so queue backlog can be
      # graphed and alerted on per queue. See rabbitmq.conf for the full rationale.
      # Mounted into conf.d/ (merged, loads after the image's own default-user
      # config) so it never conflicts with RABBITMQ_DEFAULT_USER handling.
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-factory-iot.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Relational Database
  # ──────────────────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: IoT_Secret123!
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "IoT_Secret123!", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Metrics Collection
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

  # ──────────────────────────────────────────────
  # Dashboards & Alerting
  # ──────────────────────────────────────────────
  # Everything is provisioned from files under ./grafana — data source, dashboards
  # and alert rules all appear automatically on first boot, so nothing has to be
  # clicked together in the UI. Editing a file + `docker compose restart grafana`
  # is the way to change any of it (provisioned objects are read-only in the UI).
  # See docs/MONITORING.md.
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      # Land on the MQ backlog dashboard straight after login instead of the
      # generic Grafana welcome page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/10-mq-ingestion-pipeline.json
      # Optional e-mail delivery for the provisioned alerts. Alerts always show up
      # in the Grafana UI (and on the dashboard's alert panel) without any of this;
      # set these in a .env file only if you also want mail. See docs/MONITORING.md.
      GF_SMTP_ENABLED: "${GF_SMTP_ENABLED:-false}"
      GF_SMTP_HOST: "${GF_SMTP_HOST:-}"
      GF_SMTP_USER: "${GF_SMTP_USER:-}"
      GF_SMTP_PASSWORD: "${GF_SMTP_PASSWORD:-}"
      GF_SMTP_FROM_ADDRESS: "${GF_SMTP_FROM_ADDRESS:-grafana@factory.local}"
    volumes:
      - grafana_data:/var/lib/grafana
      # Data source + dashboard provider + alert rules / contact points / policies.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON. Kept outside /var/lib/grafana on purpose so the bind mount
      # is not nested inside the grafana_data volume.
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ──────────────────────────────────────────────
  # Backend API (Presentation layer)
  # ──────────────────────────────────────────────
  backend-api:
    build:
      context: .
      dockerfile: src/FactoryIoT.Presentation/Dockerfile
    container_name: backend-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      ConnectionStrings__Default: "Server=mssql,1433;Database=factory_iot;User Id=sa;Password=IoT_Secret123!;TrustServerCertificate=True"
      # ── Storage tiers ──────────────────────────────────────────────────────
      # Raw readings are kept briefly; everything older is served from
      # pre-aggregated buckets. Without this the database grows ~1.7 GB/day at
      # the shipped rate and hits SQL Server Express's hard 10 GB per-database
      # ceiling inside a week. Sizing and trade-offs: docs/DATA-LIFECYCLE.md.
      DataRetention__RawTelemetryHours: "72"
      DataRetention__RawSensorReadingHours: "24"
      DataRetention__MinuteRollupHours: "720"
      DataRetention__HourRollupHours: "17520"
      # How far back /api/v1/machines may look for readings not yet aggregated.
      # The roster is only as fresh as the last closed bucket, so without this
      # overlay every machine reports "last seen 3 minutes ago" and the
      # dashboard draws a healthy fleet as stale. Only a safety clamp: it binds
      # solely when aggregation has stalled or is switched off.
      DataRetention__RosterTailMinutes: "15"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mssql:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # IoT Device Simulator
  # ──────────────────────────────────────────────
  simulator:
    build:
      context: .
      dockerfile: src/FactoryIoT.Simulator/Dockerfile
    container_name: simulator
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Frontend Dashboard (React + Vite, served by nginx)
  # ──────────────────────────────────────────────
  # nginx serves the static build and reverse-proxies /api and /health to the
  # backend-api service, so the browser uses a single origin. Open the dashboard
  # at http://localhost:8081.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend-api

volumes:
  rabbitmq_data:
  mssql_data:
  prometheus_data:
  grafana_data:
