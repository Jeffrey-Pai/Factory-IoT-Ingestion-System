# nginx config for the production dashboard image.
#
# Serves the static Vite build and reverse-proxies API/health traffic to the
# backend service, so the browser talks to a single origin (no CORS needed).
# The backend host below matches the docker-compose service name — change it if
# you deploy the API elsewhere.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the upstream at request time (via a
    # variable in proxy_pass) lets nginx start even if the API is momentarily
    # down — it just returns 502 until the backend is reachable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fingerprinted build assets can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API → backend.
    location /api/ {
        set $upstream backend-api:8080;
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoints (/health, /health/worker) → backend.
    location /health {
        set $upstream backend-api:8080;
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA history-mode fallback: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
